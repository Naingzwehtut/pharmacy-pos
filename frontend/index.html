<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#164f31" />
    <meta name="description" content="Zwe Pharmacy point of sale" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Zwe Pharmacy</title>
    <script>
      // Apply the saved light/dark theme before the app loads (no white flash)
      try {
        var t = localStorage.getItem('ui_theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
